name: Backend CI

on:
  pull_request:
  push:
    branches: [main, master, ultimos-cambios/fixer]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hubsport_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hubsport_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, gd
          coverage: xdebug
      - uses: ramsey/composer-install@v3
      - run: php artisan test tests/Feature/Flows tests/Feature/Demo tests/Feature/Chat tests/Feature/Auth/ApiResetPasswordTest.php
      - run: vendor/bin/pint --test app/Demo app/Http/Controllers/V1/Demo app/Http/Requests/Auth/LoginRequest.php tests/Feature/Demo tests/Feature/Flows
